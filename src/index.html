<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Legacy auth URLs are handed off before loading the Angular application. -->
  <meta name="referrer" content="no-referrer" />
  <script>
    (function () {
      var match = location.pathname.match(/^\/auth\/([^/]+)\/?$/);
      if (!match) return;
      var pages = { login: 'signin', 'sign-up': 'signup', registration: 'signup', register: 'signup', 'password-reset': 'reset-password', 'verify-login-email': 'verify-email', 'email-reconfirm': 'verify-email', 'verify-email': 'verify-email', callback: 'callback', logout: 'signout' };
      if (!pages[match[1]]) return;
      var host = location.hostname;
      var local = host === 'localhost' || host === '127.0.0.1';
      var domain = host === 'app.insightabusiness.com' ? 'insightabusiness.com' : host === 'app.foresighta.co' ? 'foresighta.co' : null;
      if (!local && !domain) return;
      var params = new URLSearchParams(location.search);
      var readCookie = function(name) { var item = document.cookie.split('; ').find(function(c) { return c.indexOf(name + '=') === 0; }); if (!item) return ''; try { return decodeURIComponent(item.slice(name.length + 1)); } catch (_) { return ''; } };
      var lang = params.get('lang') || readCookie('preferred_language');
      if (lang !== 'ar' && lang !== 'en') { try { lang = localStorage.getItem('language'); } catch (_) {} }
      lang = lang === 'ar' ? 'ar' : 'en';
      var token = params.get('token');
      // The backend still returns a bearer token to this legacy callback. Consume
      // it on this origin and scrub it before handing off; never forward it.
      if (match[1] === 'callback' && token && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token) && token.length < 12000) {
        document.cookie = 'token=' + encodeURIComponent(token) + '; Path=/; Max-Age=604800; SameSite=Lax' + (domain ? '; Domain=.' + domain + '; Secure' : '');
      }
      params.delete('token'); params.delete('roles');
      history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
      var base = local ? location.protocol + '//' + host + ':3000' : 'https://' + domain;
      location.replace(base + '/' + lang + '/' + pages[match[1]] + (params.toString() ? '?' + params.toString() : ''));
      window.__authRedirecting = true;
    })();
  </script>

  <title>Insighta  - Redefining the insights landscape</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="./assets/media/logos/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Almarai:300,400,500,600,700" type="text/css">
  <script defer src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
<link rel="preconnect" type="text/css" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- SPLASH SCREEN-->
  <link rel="stylesheet" id="layout-styles-anchor" href="./assets/splash-screen.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body root id="kt_body" class="mat-typography">
  <!-- <body root id="kt_body" class="mat-typography" direction="rtl" dir="rtl" style="direction: rtl"></body> -->
  <!--begin::Theme mode setup on page load-->
  <script>
    if (document.documentElement) {
      var defaultThemeMode = "system";

      var hasKTName = document.body.hasAttribute("data-kt-name");
      var lsKey = "kt_" + (hasKTName ? name + "_" : "") + "theme_mode_value"
      var themeMode = localStorage.getItem(lsKey);
      if (!themeMode) {
        if (defaultThemeMode === "system") {
          themeMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else {
          themeMode = defaultThemeMode;
        }
      }

      document.documentElement.setAttribute("data-bs-theme", themeMode);
    }
  </script>
  <!--end::Theme mode setup on page load-->
  <div id="splash-screen" class="splash-screen">
    <div class="loading-bar">
      <div class="loading-bar-progress"></div>
    </div>
  </div>

  <script>
    // Handle splash screen
    document.addEventListener('DOMContentLoaded', function() {
      const splashScreen = document.getElementById('splash-screen');
      const progressBar = document.querySelector('.loading-bar-progress');
      
      // Ensure the logo is pre-loaded
      const img = new Image();
      img.src = './assets/media/logos/default-small.svg';
      
      // Animate progress bar
      if (progressBar) {
        progressBar.style.width = '100%';
      }
      
      // Hide splash screen when everything is loaded
      window.addEventListener('load', function() {
        setTimeout(() => {
          if (splashScreen) {
            splashScreen.classList.add('hidden');
          }
        }, 1000);
      });
    });
  </script>
</body>

</html>
