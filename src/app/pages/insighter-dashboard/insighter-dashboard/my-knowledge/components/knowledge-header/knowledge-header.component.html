<div class="card card-flush pb-0 bgi-position-y-center bgi-no-repeat mb-10">
  <!--begin::Card header-->
  <div class="card-header pt-10">
    <div class="d-flex align-items-center w-100 flex-wrap">
      <!--begin::Icon-->
      <div class="symbol symbol-circle me-5">
        <div
          class="symbol-label bg-transparent text-primary border border-secondary border-dashed"
        >
          <app-dashboard-nav-icon name="book"></app-dashboard-nav-icon>
        </div>
      </div>
      <!--end::Icon-->

      <!--begin::Title-->
      <div class="d-flex flex-column">
        <h2 class="mb-1 text-info fs" style="max-height: 40px !important;">{{ "KNOWLEDGE.TITLE" | translate }}</h2>
        <div class="text-muted fw-bold">
          <!-- <a class="text-primary">{{ 'KNOWLEDGE.TOTAL' | translate }}</a> 
          <span class="mx-3">|</span>
          {{ totalSize }} <span class="mx-3">|</span> {{ totalItems }} {{ 'KNOWLEDGE.ITEMS' | translate }}       -->
        </div>
      </div>
      <!--end::Title-->
    </div>
  </div>
  <!--end::Card header-->

  <!--begin::Card body-->
  <div class="card-body pb-0">
    <!--begin::Navs-->
    <div class="d-flex overflow-auto sm-h-55px">
      <ul
        class="nav nav-stretch nav-line-tabs nav-line-tabs-2x border-transparent fs-5 fw-semibold flex-nowrap"
      >
        <li class="nav-item">
          <a
            class="nav-link text-active-primary me-6"
            routerLink="general"
            routerLinkActive="active"
          >
           {{ lang === 'ar' ? 'الكل' : 'All Knowledge' }}
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link text-active-primary me-6"
            routerLink="posted"
            routerLinkActive="active"
          >
            {{ "KNOWLEDGE.TABS.POSTED" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link text-active-primary me-6"
            routerLink="scheduled"
            routerLinkActive="active"
          >
            {{ "KNOWLEDGE.TABS.SCHEDULED" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link text-active-primary me-6"
            routerLink="unpublished"
            routerLinkActive="active"
          >
            {{ "KNOWLEDGE.TABS.UNPUBLISHED" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <span class="nav-link text-muted me-6 d-sm-block d-none" style="cursor: default;">
            {{ "KNOWLEDGE.TABS.PACKAGES" | translate }} 
            <sup class="text-danger text-xm opacity-50 mx-2  bg-light-danger rounded-pill">Coming Soon</sup>
          </span>
        </li>
      </ul>
    </div>
    <!--begin::Navs-->
  </div>
  <!--end::Card body-->
</div>
